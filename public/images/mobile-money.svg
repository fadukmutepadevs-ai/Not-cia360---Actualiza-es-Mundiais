<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="badgeFin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#finBg)"/>

  <!-- Ondas Digitais de Frequência / Pagamento Instantâneo -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.4" fill="none">
    <circle cx="400" cy="225" r="160"/>
    <circle cx="400" cy="225" r="220" stroke-dasharray="6 6"/>
    <circle cx="400" cy="225" r="280"/>
  </g>

  <!-- Smartphone Central -->
  <g transform="translate(320, 75)">
    <!-- Corpo do Telemóvel -->
    <rect x="0" y="0" width="160" height="300" rx="24" fill="#090d16" stroke="#475569" stroke-width="4" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.6))"/>
    <!-- Ecrã -->
    <rect x="10" y="20" width="140" height="260" rx="14" fill="url(#screenGrad)"/>
    <!-- Alto-falante superior -->
    <rect x="60" y="8" width="40" height="4" rx="2" fill="#64748b"/>

    <!-- Conteúdo no Ecrã: Confirmação de Transferência -->
    <circle cx="80" cy="90" r="30" fill="#ffffff" opacity="0.2"/>
    <circle cx="80" cy="90" r="22" fill="#10b981"/>
    <!-- Símbolo de Verificado (Check) -->
    <path d="M 70,90 L 77,97 L 90,82" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="80" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TRANSACÇÃO</text>
    <text x="80" y="162" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">INSTANTÂNEA</text>

    <!-- Barra de progresso / confirmação -->
    <rect x="25" y="190" width="110" height="24" rx="6" fill="#10b981"/>
    <text x="80" y="206" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">100% CONCLUÍDO</text>

    <!-- Indicador de botão home inferior -->
    <rect x="50" y="270" width="60" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Moedas e Ícones Flutuantes ao Redor -->
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="32" fill="#f59e0b" stroke="#d97706" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
    <text x="0" y="8" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">MT</text>
  </g>

  <g transform="translate(620, 210)">
    <circle cx="0" cy="0" r="30" fill="#059669" stroke="#047857" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
    <!-- Escudo de Segurança -->
    <path d="M -10,-12 L 10,-12 L 10,2 Q 0,14 -10,2 Z" fill="#ffffff"/>
  </g>
</svg>
