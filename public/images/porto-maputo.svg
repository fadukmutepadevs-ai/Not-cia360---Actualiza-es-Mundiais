<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="oceanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="seaWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="badgeMoz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Céu e Pôr do Sol na Baía de Maputo -->
  <rect width="800" height="450" fill="url(#oceanSky)"/>

  <!-- Oceano / Águas Portuárias -->
  <rect y="250" width="800" height="200" fill="url(#seaWater)"/>
  <!-- Reflexos na água -->
  <path d="M 0,265 Q 200,260 400,265 T 800,265" stroke="#38bdf8" stroke-width="2" opacity="0.3" fill="none"/>
  <path d="M 0,290 Q 200,285 400,290 T 800,290" stroke="#38bdf8" stroke-width="2" opacity="0.2" fill="none"/>
  <path d="M 0,330 Q 200,325 400,330 T 800,330" stroke="#38bdf8" stroke-width="3" opacity="0.2" fill="none"/>

  <!-- Cais e Doca Terrestre à Direita -->
  <polygon points="560,240 800,240 800,450 500,450" fill="#334155"/>
  <polygon points="560,240 800,240 800,255 550,255" fill="#64748b"/>

  <!-- Navio Porta-Contentores (Cargueiro) -->
  <g transform="translate(60, 200)">
    <!-- Casco do navio -->
    <polygon points="40,90 400,90 450,45 420,30 20,30" fill="#b91c1c"/>
    <polygon points="20,30 420,30 410,20 40,20" fill="#1e293b"/>

    <!-- Contentores empilhados no navio -->
    <!-- Nível 1 -->
    <rect x="50" y="-5" width="60" height="25" fill="#2563eb" stroke="#1d4ed8"/>
    <rect x="115" y="-5" width="60" height="25" fill="#f59e0b" stroke="#d97706"/>
    <rect x="180" y="-5" width="60" height="25" fill="#16a34a" stroke="#15803d"/>
    <rect x="245" y="-5" width="60" height="25" fill="#dc2626" stroke="#b91c1c"/>
    <rect x="310" y="-5" width="60" height="25" fill="#0284c7" stroke="#0369a1"/>

    <!-- Nível 2 -->
    <rect x="65" y="-30" width="60" height="25" fill="#16a34a" stroke="#15803d"/>
    <rect x="130" y="-30" width="60" height="25" fill="#2563eb" stroke="#1d4ed8"/>
    <rect x="195" y="-30" width="60" height="25" fill="#dc2626" stroke="#b91c1c"/>
    <rect x="260" y="-30" width="60" height="25" fill="#f59e0b" stroke="#d97706"/>

    <!-- Ponte de comando do navio na popa -->
    <rect x="365" y="-45" width="40" height="65" fill="#f8fafc"/>
    <rect x="375" y="-35" width="20" height="10" fill="#0284c7"/>
    <line x1="385" y1="-45" x2="385" y2="-65" stroke="#f8fafc" stroke-width="3"/>
  </g>

  <!-- Grandes Guindastes Portuários (STS Cranes) -->
  <g transform="translate(560, 90)">
    <!-- Guindaste 1 -->
    <path d="M 40,150 L 70,20 L 150,20 L 220,150" stroke="#f59e0b" stroke-width="5" fill="none"/>
    <line x1="0" y1="20" x2="260" y2="20" stroke="#f59e0b" stroke-width="6"/>
    <line x1="50" y1="90" x2="200" y2="90" stroke="#f59e0b" stroke-width="4"/>
    <line x1="70" y1="20" x2="190" y2="90" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="140" y1="20" x2="60" y2="90" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="90" y="30" width="18" height="22" fill="#0284c7"/>
  </g>
</svg>
