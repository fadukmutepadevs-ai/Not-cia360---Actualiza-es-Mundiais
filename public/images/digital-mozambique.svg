<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="60%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Rede de Malha Digital / Grid -->
  <g stroke="#1e3a8a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Estrutura de Conectividade em Fibra Óptica e Nódulos -->
  <g stroke="#06b6d4" stroke-width="2.5" opacity="0.8" fill="none">
    <path d="M 120,380 L 260,260 L 400,290 L 520,160 L 680,220 L 750,110"/>
    <path d="M 260,260 L 320,140 L 520,160"/>
    <path d="M 400,290 L 480,390 L 680,220"/>
    <path d="M 80,180 L 260,260"/>
  </g>

  <!-- Nódulos brilhantes -->
  <g fill="#ffffff">
    <circle cx="260" cy="260" r="7" fill="#38bdf8"/>
    <circle cx="260" cy="260" r="14" fill="#38bdf8" opacity="0.3"/>
    <circle cx="400" cy="290" r="8" fill="#f59e0b"/>
    <circle cx="400" cy="290" r="16" fill="#f59e0b" opacity="0.3"/>
    <circle cx="520" cy="160" r="9" fill="#06b6d4"/>
    <circle cx="520" cy="160" r="18" fill="#06b6d4" opacity="0.3"/>
    <circle cx="680" cy="220" r="7" fill="#10b981"/>
    <circle cx="680" cy="220" r="14" fill="#10b981" opacity="0.3"/>
    <circle cx="320" cy="140" r="6" fill="#ec4899"/>
    <circle cx="120" cy="380" r="6" fill="#38bdf8"/>
  </g>

  <!-- Silhueta urbana / skyline tecnológico estilizado -->
  <g fill="#0b1b36" opacity="0.85">
    <rect x="80" y="280" width="45" height="170"/>
    <rect x="135" y="240" width="60" height="210"/>
    <rect x="205" y="300" width="50" height="150"/>
    <rect x="265" y="220" width="75" height="230"/>
    <rect x="350" y="270" width="55" height="180"/>
    <rect x="415" y="210" width="80" height="240"/>
    <rect x="505" y="250" width="65" height="200"/>
    <rect x="580" y="230" width="70" height="220"/>
    <rect x="660" y="280" width="55" height="170"/>
  </g>

  <!-- Janelas tecnológicas no horizonte -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="150" cy="260" r="2"/>
    <circle cx="170" cy="260" r="2"/>
    <circle cx="150" cy="290" r="2"/>
    <circle cx="170" cy="290" r="2"/>
    <circle cx="285" cy="240" r="2"/>
    <circle cx="310" cy="240" r="2"/>
    <circle cx="435" cy="230" r="2"/>
    <circle cx="465" cy="230" r="2"/>
    <circle cx="435" cy="260" r="2"/>
    <circle cx="465" cy="260" r="2"/>
    <circle cx="600" cy="250" r="2"/>
    <circle cx="625" cy="250" r="2"/>
  </g>
</svg>
