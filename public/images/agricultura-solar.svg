<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="farmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="cropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="badgeAgro" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Amanhecer no Campo -->
  <rect width="800" height="450" fill="url(#farmSky)"/>

  <!-- Sol Nascente -->
  <circle cx="400" cy="180" r="70" fill="#f59e0b" opacity="0.8"/>
  <circle cx="400" cy="180" r="100" fill="#fde047" opacity="0.3"/>

  <!-- Colinas e Linhas de Plantação Agrícola -->
  <polygon points="0,240 800,240 800,450 0,450" fill="url(#cropGrad)"/>

  <!-- Fileiras de cultivo em perspectiva cónica -->
  <g stroke="#15803d" stroke-width="4">
    <line x1="400" y1="240" x2="-50" y2="450"/>
    <line x1="400" y1="240" x2="100" y2="450"/>
    <line x1="400" y1="240" x2="250" y2="450"/>
    <line x1="400" y1="240" x2="400" y2="450"/>
    <line x1="400" y1="240" x2="550" y2="450"/>
    <line x1="400" y1="240" x2="700" y2="450"/>
    <line x1="400" y1="240" x2="850" y2="450"/>
  </g>

  <!-- Sistema de Irrigação / Aspersores de Água em Funcionamento -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.8" fill="none">
    <!-- Aspersor 1 -->
    <path d="M 250,330 Q 210,270 170,300"/>
    <path d="M 250,330 Q 290,260 330,290"/>
    <path d="M 250,330 Q 250,250 240,290"/>
    <circle cx="250" cy="330" r="4" fill="#0284c7"/>

    <!-- Aspersor 2 -->
    <path d="M 550,330 Q 510,270 470,300"/>
    <path d="M 550,330 Q 590,260 630,290"/>
    <path d="M 550,330 Q 550,250 560,290"/>
    <circle cx="550" cy="330" r="4" fill="#0284c7"/>
  </g>

  <!-- Painel Solar Fotovoltaico Dedicado à Bomba de Água -->
  <g transform="translate(620, 220)">
    <line x1="40" y1="70" x2="40" y2="130" stroke="#475569" stroke-width="5"/>
    <polygon points="0,70 80,50 95,100 15,120" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <line x1="40" y1="60" x2="55" y2="110" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="8" y1="95" x2="88" y2="75" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
</svg>
